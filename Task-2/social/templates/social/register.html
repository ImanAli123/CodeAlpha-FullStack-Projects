{% extends 'social/base.html' %}
{% block title %}Create Account | ConnectHub{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Join ConnectHub</h1>
    <p>Create your account and connect with people.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Create Account</button>
    </form>
    <p>Already a member? <a href="{% url 'login' %}">Login here</a></p>
</section>
{% endblock %}
