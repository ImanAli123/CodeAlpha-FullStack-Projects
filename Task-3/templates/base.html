<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #243047;
        }

        nav {
            background: #202b46;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

            nav a {
                color: white;
                text-decoration: none;
            }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .btn {
            display: inline-block;
            background: #4f65e8;
            color: white;
            padding: 10px 15px;
            border: 0;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        .secondary {
            background: #64748b;
        }

        .danger {
            background: #c43d4b;
        }

        .panel, .card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #1725540c;
            margin-bottom: 15px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px;
            border: 1px solid #ccd3e0;
            border-radius: 6px;
        }

            input[type=checkbox] {
                width: auto;
            }

        label {
            font-weight: 600;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(240px, 1fr));
            gap: 16px;
            align-items: start;
            overflow-x: auto;
        }

        .column {
            background: #e9edf6;
            padding: 14px;
            border-radius: 10px;
            min-width: 240px;
        }

        .muted {
            color: #69758a;
            font-size: 14px;
        }

        .topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        @media(max-width: 800px) {
            .board {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard' %}"><strong>TaskFlow</strong></a>
        {% if user.is_authenticated %}
        <span>Welcome, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" style="margin:0">
            {% csrf_token %}
            <button class="btn secondary" type="submit">Logout</button>
        </form>
        {% else %}
        <div>
            <a href="{% url 'login' %}">Login</a> |
            <a href="{% url 'register' %}">Register</a>
        </div>
        {% endif %}
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
