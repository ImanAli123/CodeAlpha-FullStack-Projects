{% extends "base.html" %}
{% block title %}Login | TaskFlow{% endblock %}
{% block content %}
<div class="panel" style="max-width:520px;margin:auto">
    <h1>Welcome back</h1>
    <p class="muted">Log in to access your projects.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Login</button>
    </form>
    <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
