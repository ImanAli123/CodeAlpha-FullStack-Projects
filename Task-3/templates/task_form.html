{% extends "base.html" %}
{% block title %}Task Form | TaskFlow{% endblock %}
{% block content %}
<div class="panel" style="max-width:700px;margin:auto">
    <h1>{% if task %}Edit Task{% else %}Create Task{% endif %}</h1>
    <p class="muted">Project: {{ project.name }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save Task</button>
        <a class="btn secondary"
           href="{% url 'project_detail' project.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
