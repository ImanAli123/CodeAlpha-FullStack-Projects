
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopEase{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #20243a;
        }

        nav {
            background: #252b55;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

            nav a {
                color: white;
                text-decoration: none;
                margin-right: 14px;
            }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000c;
        }

            .card img {
                width: 100%;
                height: 190px;
                object-fit: contain;
            }

        button, .btn {
            background: #5158cf;
            color: white;
            border: 0;
            padding: 11px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin: 7px 0 14px;
            border: 1px solid #ccd0dd;
            border-radius: 6px;
        }

        .message {
            padding: 12px;
            background: #e7edff;
            margin: 10px 0;
        }

        .price {
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}"><strong>ShopEase</strong></a>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart' %}">Cart</a>
            {% if user.is_authenticated %}
            <span>Hello, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post"
                  style="display:inline">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% if messages %}
        {% for message in messages %}
        <div class="message">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script>
        document.querySelectorAll('form').forEach(function (form) {
        form.addEventListener('submit', function () {
        const button = form.querySelector('button[type="submit"]');
        if (button && button.name !== 'remove') {
        button.textContent = 'Processing...';
        }
        });
        });
    </script>
</body>
</html>
