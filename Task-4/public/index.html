<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MeetBoard</title>
    <style>
        :root {
            --bg: #10141c;
            --card: #1a2030;
            --ac: #4f8cff;
            --tx: #e8ecf4
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui,sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        input, button {
            font: inherit;
            padding: .6rem .9rem;
            border-radius: 8px;
            border: 1px solid #2c3550;
            background: var(--card);
            color: var(--tx)
        }

        button {
            cursor: pointer;
            background: var(--ac);
            border: 0
        }

            button.sec {
                background: #2c3550
            }

            button.off {
                background: #c0392b
            }

        #auth, #lobby {
            max-width: 340px;
            margin: 12vh auto;
            display: flex;
            flex-direction: column;
            gap: .7rem
        }

        #app {
            display: none;
            height: 100vh;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr auto
        }

        #main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: .6rem
        }

        #grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
            gap: .6rem;
            overflow: auto
        }

        .tile {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            min-height: 150px
        }

            .tile video {
                width: 100%;
                height: 100%;
                object-fit: cover
            }

            .tile span {
                position: absolute;
                left: 8px;
                bottom: 6px;
                background: #0009;
                padding: 2px 8px;
                border-radius: 6px;
                font-size: .8rem
            }

        #board {
            display: none;
            background: #fff;
            border-radius: 10px;
            width: 100%;
            flex: 1;
            touch-action: none;
            cursor: crosshair
        }

        #side {
            background: var(--card);
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: .6rem;
            gap: .5rem
        }

        #log {
            flex: 1;
            overflow: auto;
            font-size: .9rem;
            display: flex;
            flex-direction: column;
            gap: .3rem
        }

            #log a {
                color: #8fb4ff
            }

        #bar {
            grid-column: 1/3;
            display: flex;
            gap: .5rem;
            justify-content: center;
            padding: .6rem;
            background: var(--card);
            flex-wrap: wrap
        }

        #err {
            color: #ff7b7b;
            min-height: 1.2em
        }
    </style>
</head>
<body>
    <div id="auth">
        <h2>MeetBoard</h2>
        <input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password (min 8)" autocomplete="current-password">
        <button id="login">Log in</button><button id="reg" class="sec">Create account</button><div id="err"></div>
    </div>
    <div id="lobby" style="display:none">
        <h2>Join a room</h2>
        <input id="room" placeholder="Room name" value="team-room"><input id="pass" type="password" placeholder="Room passphrase (encrypts chat)">
        <button id="join">Join</button>
    </div>
    <div id="app">
        <div id="main"><div id="grid"></div><canvas id="board"></canvas></div>
        <div id="side"><div id="log"></div><input id="msg" placeholder="Encrypted message, Enter to send"><input id="file" type="file"></div>
        <div id="bar">
            <button id="mic" class="sec">Mute</button><button id="cam" class="sec">Camera off</button>
            <button id="scr" class="sec">Share screen</button><button id="wb" class="sec">Whiteboard</button>
            <input id="color" type="color" value="#1f6feb" title="Pen color"><button id="clr" class="sec">Clear board</button>
            <button id="leave" class="off">Leave</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
